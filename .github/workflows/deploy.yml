name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PUBLIC_ADSENSE_PUB_ID: ${{ secrets.ADSENSE_PUB_ID }}
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate data
        run: pnpm data:validate

      - name: Unit tests
        run: pnpm test

      - name: Build (includes sitemap, internal-link audit, build report)
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: pnpm exec netlify-cli deploy --prod --dir=dist --site="$NETLIFY_SITE_ID"

      - name: Submit changed URLs to IndexNow
        run: pnpm indexnow:submit
