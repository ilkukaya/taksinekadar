name: SEO Audit

on:
  pull_request:
  workflow_dispatch:

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate data
        run: pnpm data:validate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Build (includes sitemap generation and internal-link audit)
        run: pnpm build

      - name: Upload build report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: data/reports/build-report.md
