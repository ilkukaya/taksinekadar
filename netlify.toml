# Netlify builds and deploys directly on every push (no GitHub Actions in the loop) —
# there's no scheduled/external data pipeline yet that would need a separate CI job, so
# Netlify's own build is the whole pipeline. The command still gates deploys on data
# integrity and unit tests; `pnpm build` itself fails on broken links, orphan pages, or
# duplicate titles/descriptions (see scripts/audit-internal-links.ts).
[build]
  publish = "dist"
  command = "pnpm data:validate && pnpm test && pnpm build"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/sitemaps/*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
